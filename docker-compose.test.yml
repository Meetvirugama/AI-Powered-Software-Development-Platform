# Docker Compose configuration for E2E and Integration Test Profile (TST-E0..E6).
# Used by local testing and CI workflow test stages.

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: agent_platform_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d agent_platform_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      SERVICE_ROLE: api
      APP_ENV: test
      ENABLE_DEV_LOGIN: "true"
      DISABLE_EMBEDDED_SYNC_WORKER: "true"
      DATABASE_URL: postgresql://test_user:test_password@postgres:5432/agent_platform_test
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: test-super-secret-jwt-key-minimum-32-chars-long!
      JWT_ISSUER: agent-platform-test
      JWT_AUDIENCE: agent-platform-test-web
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      SANDBOX_BACKEND: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sync_worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_ROLE: sync_worker
      APP_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@postgres:5432/agent_platform_test
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: test-super-secret-jwt-key-minimum-32-chars-long!
      SANDBOX_BACKEND: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  webhook_worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_ROLE: webhook_worker
      APP_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@postgres:5432/agent_platform_test
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: test-super-secret-jwt-key-minimum-32-chars-long!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
