name: Security CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Modern Secret Scanning (Gitleaks with .gitleaks.toml)
  # ---------------------------------------------------------------------------
  gitleaks-scan:
    name: "Security: Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------------------------
  # Job 2: Static Security Analysis (Bandit & Ruff Security Rules)
  # ---------------------------------------------------------------------------
  static-security-analysis:
    name: "Security: Bandit & Ruff Linter"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install security linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Run Ruff static syntax and security checks
        run: |
          ruff check backend/app backend/ai backend/agent backend/indexer backend/review backend/runner backend/sandbox backend/scanner --select E9,F63,F7,F82

      - name: Run Bandit security linter (fail on HIGH severity)
        run: |
          bandit -r backend/app --severity-level high -q
          bandit -r backend/app -ll -f json -o bandit-report.json || true

      - name: Upload Bandit static analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 3: Dependency Vulnerability Audit (pip-audit)
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: "Security: pip-audit Dependency Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit production dependencies with pip-audit
        run: |
          pip-audit -r backend/requirements.txt --desc on

  # ---------------------------------------------------------------------------
  # Job 4: Security Gate Suite & RBAC Integration Tests
  # ---------------------------------------------------------------------------
  security-gate-and-tests:
    name: "Security: Gate Suite & RBAC Verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run platform security gate suite
        env:
          JWT_SECRET: "ci-security-gate-jwt-secret-key-32-chars-min"
          GITHUB_WEBHOOK_SECRET: "ci-security-gate-webhook-secret"
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: "testing"
        run: |
          python backend/scripts/security_gate.py --skip-db --out security-gate-report.md

      - name: Run RBAC and API security unit & integration tests
        env:
          JWT_SECRET: "ci-security-gate-jwt-secret-key-32-chars-min"
          ENVIRONMENT: "testing"
        run: |
          pytest -o addopts="" backend/tests/test_rbac_and_api_security.py -v

      - name: Upload security gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: security-gate-report.md
          if-no-files-found: ignore
