# =============================================================================
# Production CI/CD Quality Gates & Azure Deployment Pipeline
# Enforces comprehensive verification across:
#   1. Backend lint, syntax, and static checks
#   2. Backend unit, security, and integration test suites
#   3. Frontend lint and TypeScript compilation
#   4. Frontend Vitest unit tests and production build
#   5. Database migration validation
#   6. Security and dependency scanning
#   7. Build packaging and artifact publishing (gated on all tests passing)
#   8. Azure Web App deployment (strictly conditional on quality gates)
#   9. Post-deployment health verification and smoke tests
# =============================================================================

name: Build, Verify, and Deploy to Azure Web App

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Backend Lint & Static Analysis (compileall, Ruff, Bandit)
  # ---------------------------------------------------------------------------
  backend-lint-and-static:
    name: "Backend: Lint & Static Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dev & static analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify Python syntax across backend codebase
        run: |
          python -m compileall -q -f -x "backend/tests/fixtures" backend/

      - name: Run Ruff static analysis checks
        run: |
          ruff check backend/app backend/ai backend/agent backend/indexer backend/review backend/runner backend/sandbox backend/scanner --select E9,F63,F7,F82
          ruff check backend/app --statistics || true

      - name: Run Bandit security linter (fail on HIGH severity)
        run: |
          bandit -r backend/app --severity-level high -q
          bandit -r backend/app -ll -f json -o bandit-report.json || true

      - name: Upload Bandit static analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Stage 2: Backend Unit, Security & Integration Tests
  # ---------------------------------------------------------------------------
  backend-tests:
    name: "Backend: Unit & Integration Tests"
    runs-on: ubuntu-latest
    needs: backend-lint-and-static
    env:
      JWT_SECRET: "ci-testing-jwt-secret-key-32-chars-min"
      GITHUB_WEBHOOK_SECRET: "ci-testing-webhook-secret"
      DATABASE_URL: "sqlite:///:memory:"
      TEST_DATABASE_URL: "sqlite:///:memory:"
      APP_ENV: "testing"
      ENVIRONMENT: "testing"
      SANDBOX_BACKEND: "local"
      COOKIE_SECURE: "false"
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Full Backend & E2E Test Suite with Coverage Gate (>=50%)
        run: |
          pytest backend/tests/ \
                 --ignore=backend/tests/fixtures \
                 --ignore=backend/tests/test_migration_smoke.py \
                 -o addopts= \
                 --timeout=120 \
                 --cov=app \
                 --cov=ai \
                 --cov-report=term-missing \
                 --cov-report=xml:coverage.xml \
                 --cov-fail-under=50 \
                 -v

      - name: Run end-to-end API and workflow tests
        run: |
          python -m pytest tests/e2e -o addopts= --timeout=120 -q \
            --cov=app --cov=ai --cov-append --cov-fail-under=50 \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Stage 3: Frontend Lint & TypeScript Type Checking
  # ---------------------------------------------------------------------------
  frontend-lint-and-types:
    name: "Frontend: Lint & Typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Verify TypeScript types (tsc -b)
        run: npx tsc -b

  # ---------------------------------------------------------------------------
  # Stage 4: Frontend Unit Tests & Production Build
  # ---------------------------------------------------------------------------
  frontend-tests-and-build:
    name: "Frontend: Tests & Production Build"
    runs-on: ubuntu-latest
    needs: frontend-lint-and-types
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build

  # ---------------------------------------------------------------------------
  # Stage 5: PostgreSQL 16 + pgvector Migration & Vector Retrieval Validation
  # ---------------------------------------------------------------------------
  migration-validation:
    name: "Database: PostgreSQL + pgvector Migrations & Retrieval"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/platform_ci
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/platform_ci
      ENVIRONMENT: development
      JWT_SECRET: ci-migration-jwt-secret-key-32-chars-min
      SECRET_KEY: ci-migration-secret-key-at-least-32-chars
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Validate Alembic migration history and apply to PostgreSQL 16
        working-directory: backend
        run: |
          python -c "
          import subprocess
          heads = [h for h in subprocess.check_output(['alembic', 'heads'], text=True).splitlines() if h.strip()]
          assert len(heads) == 1, f'Expected single Alembic head, got: {heads}'
          "
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: Run PostgreSQL migration lifecycle, schema drift & vector retrieval tests
        run: |
          pytest --no-cov -v -k "not test_clean_schema_migration_lifecycle" \
                 backend/tests/test_migration_smoke.py \
                 backend/tests/test_analysis_persistence.py::test_complete_data_pipeline_end_to_end \
                 backend/tests/test_project_memory_service.py \
                 backend/tests/test_embedding_service.py \
                 backend/tests/test_vector_retrieval.py \
                 backend/tests/test_hybrid_retrieval.py \
                 backend/tests/test_code_lexical_retrieval.py \
                 backend/tests/test_adaptive_hnsw.py

  # ---------------------------------------------------------------------------
  # Stage 6: Security, Dependency & Secret Scan
  # ---------------------------------------------------------------------------
  security-scan:
    name: "Security: Secrets, Dependencies & Gate Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install security & test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Scan repository secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Audit production dependencies with pip-audit
        run: |
          pip-audit -r backend/requirements.txt --desc on

      - name: Run platform security gate suite
        env:
          JWT_SECRET: "ci-security-gate-jwt-secret-key-32-chars-min"
          GITHUB_WEBHOOK_SECRET: "ci-security-gate-webhook-secret"
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: "testing"
        run: |
          python backend/scripts/security_gate.py --skip-db --out security-gate-report.md

      - name: Upload security gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: security-gate-report.md
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Stage 7: Build & Packaging (Only executes when all checks pass)
  # ---------------------------------------------------------------------------
  build-and-package:
    name: "Package: Build Artifacts"
    runs-on: ubuntu-latest
    needs:
      - backend-lint-and-static
      - backend-tests
      - frontend-lint-and-types
      - frontend-tests-and-build
      - migration-validation
      - security-scan
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build production Docker image (multi-stage verification)
        run: |
          docker build --file Dockerfile --target runtime -t ai-dev-platform:ci .

      - name: Create production deployment bundle (prod deps only)
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --no-cache-dir -r requirements.txt

      - name: Pre-download cross-encoder reranker weights into the release bundle
        run: |
          source antenv/bin/activate
          python -c "from sentence_transformers import CrossEncoder; CrossEncoder('cross-encoder/ms-marco-MiniLM-L-6-v2').save_pretrained('model_cache/reranker')"
          test -f model_cache/reranker/config.json
          du -sh model_cache/reranker

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/
            !.pytest_cache/
            !.ruff_cache/
            !.workspaces/
            !htmlcov/
            !antenv/
            !frontend/
            !frontend/node_modules/

  # ---------------------------------------------------------------------------
  # Stage 7b: Run Release Database Migrations Once Before Deployment
  # ---------------------------------------------------------------------------
  migrate-database:
    name: "Migrate: Production Database"
    runs-on: ubuntu-latest
    needs: build-and-package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Check production database migration secret
        id: db_guard
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$PRODUCTION_DATABASE_URL" ]; then
            echo "::warning::PRODUCTION_DATABASE_URL secret is not set; skipping release migration job (keep RUN_MIGRATIONS_ON_STARTUP=true until configured)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install backend runtime dependencies for Alembic
        if: steps.db_guard.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run release Alembic migrations
        if: steps.db_guard.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          APP_ENV: release
          SERVICE_ROLE: migrate
        run: |
          bash startup.sh migrate

  # ---------------------------------------------------------------------------
  # Stage 8: Azure Production Deployment (main branch only)
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploy: Azure Web App"
    runs-on: ubuntu-latest
    needs:
      - build-and-package
      - migrate-database
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      webapp-url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read
      deployments: write
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F1F2BA1EFA6A44DC9C67E52CC542446A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F5CA4B1BDC3647FFBF114253AA948A4D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FBC8B15832C5410083B5503431A35776 }}

      - name: Ensure correct production app settings on Azure Web App
        run: |
          # Apply the small set of non-secret settings that must be correct for
          # production startup. Secret values (DB, JWT, API keys, Redis) are
          # managed directly in the Azure Portal / Key Vault and are NOT stored
          # in this repository.
          az webapp config appsettings set \
            --name ai-powered-dev-platform-api \
            --resource-group ai-powered-dev-platform-api_group \
            --settings \
              APP_ENV=production \
              SANDBOX_BACKEND=container \
              WEBSITES_PORT=8000 \
              PORT=8000 \
              PYTHONPATH=/home/site/wwwroot/backend:/home/site/wwwroot \
              TRUST_PROXY_HEADERS=true \
              ENABLE_ORYX_BUILD=true \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
            --output none

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ai-powered-dev-platform-api'
          slot-name: 'Production'

      - name: Mark GitHub Deployment as success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Azure Web App deployment',
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://ai-powered-dev-platform-api-ehgdcmdfbseufsc6.indiasouthcentral-01.azurewebsites.net',
              description: 'Deployment to Azure succeeded',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  # ---------------------------------------------------------------------------
  # Stage 9: Post-Deployment Smoke Test & Health Check
  # ---------------------------------------------------------------------------
  post-deployment-verification:
    name: "Verification: Post-Deployment Health Smoke Test"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DEPLOYED_URL: ${{ needs.deploy.outputs.webapp-url || vars.AZURE_WEBAPP_URL || 'https://ai-powered-dev-platform-api-ehgdcmdfbseufsc6.indiasouthcentral-01.azurewebsites.net' }}
    steps:
      - name: Verify API Health, Readiness & Docs Endpoints
        run: |
          BASE_URL="${DEPLOYED_URL%/}"
          HEALTH_URL="${BASE_URL}/api/v1/health"
          READY_URL="${BASE_URL}/api/v1/health/ready"
          DOCS_URL="${BASE_URL}/docs"
          echo "Verifying Azure API production health at ${HEALTH_URL}..."
          for i in {1..30}; do
            if curl -fsS --max-time 10 "$HEALTH_URL" | jq -e '.status == "ok"' >/dev/null &&
               curl -fsS --max-time 15 "$READY_URL" | jq -e '.database.status == "healthy"' >/dev/null &&
               curl -fsS --max-time 10 "$DOCS_URL" >/dev/null; then
              echo "Health, database readiness, and API docs passed on attempt $i."
              exit 0
            fi
            echo "Attempt $i: One or more endpoints are still unavailable."
            if [ "$i" -lt 30 ]; then sleep 10; fi
          done
          echo "::error::API health, readiness, or docs check timed out."
          echo "ROLLBACK GUIDANCE: In Azure Portal or via az webapp deployment slot swap, roll back to previous deployment slot."
          exit 1
