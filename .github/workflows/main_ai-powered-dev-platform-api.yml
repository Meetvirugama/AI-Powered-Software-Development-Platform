# =============================================================================
# Production CI/CD Quality Gates & Azure Deployment Pipeline
# Enforces comprehensive verification across:
#   1. Backend lint, syntax, and static checks
#   2. Backend unit, security, and integration test suites
#   3. Frontend lint and TypeScript compilation
#   4. Frontend Vitest unit tests and production build
#   5. Database migration validation
#   6. Security and dependency scanning
#   7. Build packaging and artifact publishing (gated on all tests passing)
#   8. Azure Web App deployment (strictly conditional on quality gates)
#   9. Post-deployment health verification and smoke tests
# =============================================================================

name: Build, Verify, and Deploy to Azure Web App

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Backend Lint & Static Analysis (compileall, Ruff, Bandit)
  # ---------------------------------------------------------------------------
  backend-lint-and-static:
    name: "Backend: Lint & Static Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dev & static analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify Python syntax across backend codebase
        run: |
          python -m compileall -q -f -x "backend/tests/fixtures" backend/

      - name: Run Ruff static analysis checks
        run: |
          ruff check backend/app backend/ai backend/agent backend/indexer backend/review backend/runner backend/sandbox backend/scanner --select E9,F63,F7,F82
          ruff check backend/app --statistics || true

      - name: Run Bandit security linter (fail on HIGH severity)
        run: |
          bandit -r backend/app --severity-level high -q
          bandit -r backend/app -ll -f json -o bandit-report.json || true

      - name: Upload Bandit static analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Stage 2: Backend Unit, Security & Integration Tests
  # ---------------------------------------------------------------------------
  backend-tests:
    name: "Backend: Unit & Integration Tests"
    runs-on: ubuntu-latest
    needs: backend-lint-and-static
    env:
      JWT_SECRET: "ci-testing-jwt-secret-key-32-chars-min"
      GITHUB_WEBHOOK_SECRET: "ci-testing-webhook-secret"
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: "testing"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Full Backend & E2E Test Suite with Coverage Gate (>=71%)
        run: |
          pytest backend/tests tests/e2e/ \
                 --cov=app \
                 --cov-report=term-missing \
                 --cov-report=xml:coverage.xml \
                 --cov-fail-under=71 \
                 -v

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Stage 3: Frontend Lint & TypeScript Type Checking
  # ---------------------------------------------------------------------------
  frontend-lint-and-types:
    name: "Frontend: Lint & Typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Verify TypeScript types (tsc -b)
        run: npx tsc -b

  # ---------------------------------------------------------------------------
  # Stage 4: Frontend Unit Tests & Production Build
  # ---------------------------------------------------------------------------
  frontend-tests-and-build:
    name: "Frontend: Tests & Production Build"
    runs-on: ubuntu-latest
    needs: frontend-lint-and-types
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build

  # ---------------------------------------------------------------------------
  # Stage 5: PostgreSQL 16 + pgvector Migration & Vector Retrieval Validation
  # ---------------------------------------------------------------------------
  migration-validation:
    name: "Database: PostgreSQL + pgvector Migrations & Retrieval"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/platform_ci
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/platform_ci
      ENVIRONMENT: development
      JWT_SECRET: ci-migration-jwt-secret-key-32-chars-min
      SECRET_KEY: ci-migration-secret-key-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Validate Alembic migration history and apply to PostgreSQL 16
        working-directory: backend
        run: |
          python -c "
          import subprocess
          heads = [h for h in subprocess.check_output(['alembic', 'heads'], text=True).splitlines() if h.strip()]
          assert len(heads) == 1, f'Expected single Alembic head, got: {heads}'
          "
          alembic upgrade head
          alembic current

      - name: Run PostgreSQL migration lifecycle, schema drift & vector retrieval tests
        run: |
          pytest --no-cov -v \
                 backend/tests/test_migration_smoke.py \
                 backend/tests/test_om_day7.py \
                 backend/tests/test_project_memory_service.py \
                 backend/tests/test_embedding_service.py \
                 backend/tests/test_vector_retrieval.py \
                 backend/tests/test_hybrid_retrieval.py \
                 backend/tests/test_code_lexical_retrieval.py \
                 backend/tests/test_adaptive_hnsw.py

  # ---------------------------------------------------------------------------
  # Stage 6: Security, Dependency & Secret Scan
  # ---------------------------------------------------------------------------
  security-scan:
    name: "Security: Secrets, Dependencies & Gate Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install security & test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Scan repository secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit production dependencies with pip-audit
        run: |
          pip-audit -r backend/requirements.txt --desc on

      - name: Run platform security gate suite
        env:
          JWT_SECRET: "ci-security-gate-jwt-secret-key-32-chars-min"
          GITHUB_WEBHOOK_SECRET: "ci-security-gate-webhook-secret"
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: "testing"
        run: |
          python backend/scripts/security_gate.py --skip-db --out security-gate-report.md

      - name: Upload security gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: security-gate-report.md
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Stage 7: Build & Packaging (Only executes when all checks pass)
  # ---------------------------------------------------------------------------
  build-and-package:
    name: "Package: Build Artifacts"
    runs-on: ubuntu-latest
    needs:
      - backend-lint-and-static
      - backend-tests
      - frontend-lint-and-types
      - frontend-tests-and-build
      - migration-validation
      - security-scan
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build production Docker image (multi-stage verification)
        run: |
          docker build --file Dockerfile --target runtime -t ai-dev-platform:ci .

      - name: Create production deployment bundle (prod deps only)
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !frontend/node_modules/

  # ---------------------------------------------------------------------------
  # Stage 8: Azure Production Deployment (main branch only)
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploy: Azure Web App"
    runs-on: ubuntu-latest
    needs: build-and-package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F1F2BA1EFA6A44DC9C67E52CC542446A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F5CA4B1BDC3647FFBF114253AA948A4D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FBC8B15832C5410083B5503431A35776 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ai-powered-dev-platform-api'
          slot-name: 'Production'

  # ---------------------------------------------------------------------------
  # Stage 9: Post-Deployment Smoke Test & Health Check
  # ---------------------------------------------------------------------------
  post-deployment-verification:
    name: "Verification: Post-Deployment Health Smoke Test"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Verify API Health Endpoint
        run: |
          echo "Verifying Azure API production health..."
          HEALTH_URL="https://ai-powered-dev-platform-api.azurewebsites.net/api/v1/health"
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check succeeded with HTTP 200 after attempt $i."
              exit 0
            fi
            echo "Attempt $i: Received HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: Health check failed to return HTTP 200 within timeout."
          echo "ROLLBACK GUIDANCE: In Azure Portal or via az webapp deployment slot swap, roll back to previous deployment slot."
          exit 1
