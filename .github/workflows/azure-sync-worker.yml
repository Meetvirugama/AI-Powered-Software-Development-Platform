name: Deploy Sync Worker to Azure Web App

on:
  workflow_run:
    workflows: ["Build, Verify, and Deploy to Azure Web App"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-worker:
    name: Deploy sync_worker to Azure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: https://ai-powered-dev-platform-worker.azurewebsites.net

    steps:
      - name: Download artifact from triggering workflow
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }},
            });
            const match = artifacts.data.artifacts.find(a => a.name === 'python-app');
            if (!match) throw new Error('Artifact python-app not found in triggering workflow');
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('python-app.zip', Buffer.from(download.data));

      - name: Unzip artifact
        run: unzip python-app.zip -d release

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F1F2BA1EFA6A44DC9C67E52CC542446A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F5CA4B1BDC3647FFBF114253AA948A4D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FBC8B15832C5410083B5503431A35776 }}

      - name: Set SERVICE_ROLE app setting on worker web app
        run: |
          az webapp config appsettings set \
            --name ai-powered-dev-platform-worker \
            --resource-group ai-platform-rg \
            --settings SERVICE_ROLE=sync_worker WEBSITES_PORT=8000

      - name: Deploy to Azure Web App (worker)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ai-powered-dev-platform-worker
          package: release

      - name: Post-deploy health check — worker process running
        run: |
          echo "Waiting 30s for worker process to start..."
          sleep 30
          STATUS=$(az webapp show \
            --name ai-powered-dev-platform-worker \
            --resource-group ai-platform-rg \
            --query "state" -o tsv)
          echo "App state: $STATUS"
          if [ "$STATUS" != "Running" ]; then
            echo "ERROR: Worker web app is not in Running state after deploy."
            exit 1
          fi
          echo "Worker process is running."
