#
# Rules in this file are custom rules specifically tailored to multi-language
# vulnerability detection (Python, JavaScript/TypeScript, Go, Java).
# All rules have been reviewed for licensing compliance and zero-leakage safety.

rules:
  # ---------------------------------------------------------------------------
  # Python Rules
  # ---------------------------------------------------------------------------
  - id: py-sqli-format-string
    languages: [python]
    severity: ERROR
    message: "Potential SQL injection via formatted query string passed to execute()"
    metadata:
      cwe: ["CWE-89"]
      owasp: ["A03:2021-Injection"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $DB.execute(f"...", ...)
          - pattern: $DB.execute("..." % (...), ...)
          - pattern: $DB.execute("...".format(...), ...)
    fix-regex:
      regex: "f['\"].*?['\"]"
      replacement: "parameterized_query"

  - id: py-cmd-injection-shell-true
    languages: [python]
    severity: ERROR
    message: "Subprocess execution with shell=True and dynamic arguments allows command injection"
    metadata:
      cwe: ["CWE-78"]
      owasp: ["A03:2021-Injection"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: subprocess.$FUNC(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)

  - id: py-path-traversal-open
    languages: [python]
    severity: WARNING
    message: "File opened with unvalidated path may allow directory traversal (CWE-22)"
    metadata:
      cwe: ["CWE-22"]
      owasp: ["A01:2021-Broken Access Control"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern: open(os.path.join(..., $UNTRUSTED, ...), ...)

  - id: py-insecure-deserialization-pickle
    languages: [python]
    severity: ERROR
    message: "Unsafe deserialization using pickle.loads() on untrusted data leads to remote code execution"
    metadata:
      cwe: ["CWE-502"]
      owasp: ["A08:2021-Software and Data Integrity Failures"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: _pickle.loads(...)

  # ---------------------------------------------------------------------------
  # JavaScript / TypeScript Rules
  # ---------------------------------------------------------------------------
  - id: js-exec-command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: "Dynamic command execution via child_process.exec() can lead to remote command injection"
    metadata:
      cwe: ["CWE-78"]
      owasp: ["A03:2021-Injection"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: child_process.exec($CMD, ...)
          - pattern: exec($CMD, ...)
          - pattern: child_process.execSync($CMD, ...)
          - pattern: execSync($CMD, ...)

  - id: js-sqli-template-literal
    languages: [javascript, typescript]
    severity: ERROR
    message: "Database query constructed using unparameterized string concatenation or template literal"
    metadata:
      cwe: ["CWE-89"]
      owasp: ["A03:2021-Injection"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $DB.query(`...${$VAR}...`, ...)
          - pattern: $DB.query("..." + $VAR, ...)

  - id: js-xss-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: "Direct assignment to innerHTML or dangerouslySetInnerHTML enables Cross-Site Scripting (XSS)"
    metadata:
      cwe: ["CWE-79"]
      owasp: ["A03:2021-Injection"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $INPUT
          - pattern: dangerouslySetInnerHTML={{ __html: $INPUT }}

  - id: js-weak-crypto-md5
    languages: [javascript, typescript]
    severity: WARNING
    message: "Use of broken cryptographic hash function MD5 or SHA1"
    metadata:
      cwe: ["CWE-327"]
      owasp: ["A02:2021-Cryptographic Failures"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("md5")
          - pattern: crypto.createHash("sha1")

  - id: js-eval-code-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: "Dynamic evaluation via eval() or new Function() allows arbitrary code execution"
    metadata:
      cwe: ["CWE-95"]
      owasp: ["A03:2021-Injection"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)

  # ---------------------------------------------------------------------------
  # Go Rules
  # ---------------------------------------------------------------------------
  - id: go-cmd-injection-exec
    languages: [go]
    severity: ERROR
    message: "Command execution using sh -c or bash -c with formatted argument allows command injection"
    metadata:
      cwe: ["CWE-78"]
      owasp: ["A03:2021-Injection"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: exec.Command("sh", "-c", fmt.Sprintf(...))
          - pattern: exec.Command("bash", "-c", fmt.Sprintf(...))
          - pattern: exec.CommandContext($CTX, "sh", "-c", fmt.Sprintf(...))

  - id: go-sqli-formatted-query
    languages: [go]
    severity: ERROR
    message: "SQL query constructed via fmt.Sprintf or concatenation allows SQL injection"
    metadata:
      cwe: ["CWE-89"]
      owasp: ["A03:2021-Injection"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $DB.Query(fmt.Sprintf(...))
          - pattern: $DB.Exec(fmt.Sprintf(...))
          - pattern: $DB.QueryRow(fmt.Sprintf(...))

  - id: go-insecure-tls-skip-verify
    languages: [go]
    severity: ERROR
    message: "InsecureSkipVerify: true disables TLS certificate verification, enabling Man-in-the-Middle attacks"
    metadata:
      cwe: ["CWE-295"]
      owasp: ["A07:2021-Identification and Authentication Failures"]
      category: security
      confidence: HIGH
    patterns:
      - pattern: "&tls.Config{..., InsecureSkipVerify: true, ...}"

  - id: go-weak-hash-md5
    languages: [go]
    severity: WARNING
    message: "Use of deprecated weak cryptographic hash md5.New() or sha1.New()"
    metadata:
      cwe: ["CWE-327"]
      owasp: ["A02:2021-Cryptographic Failures"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: md5.New()
          - pattern: sha1.New()

  # ---------------------------------------------------------------------------
  # Java Rules
  # ---------------------------------------------------------------------------
  - id: java-cmd-injection-runtime-exec
    languages: [java]
    severity: ERROR
    message: "Command execution via Runtime.getRuntime().exec() with concatenated strings allows command injection"
    metadata:
      cwe: ["CWE-78"]
      owasp: ["A03:2021-Injection"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($CMD + ...)
          - pattern: new ProcessBuilder($CMD + ...)

  - id: java-sqli-concatenation
    languages: [java]
    severity: ERROR
    message: "SQL statement constructed with string concatenation in executeQuery/executeUpdate"
    metadata:
      cwe: ["CWE-89"]
      owasp: ["A03:2021-Injection"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $STMT.executeQuery("..." + ...)
          - pattern: $STMT.executeUpdate("..." + ...)

  - id: java-insecure-deserialization
    languages: [java]
    severity: ERROR
    message: "ObjectInputStream.readObject() on untrusted input causes insecure deserialization / RCE"
    metadata:
      cwe: ["CWE-502"]
      owasp: ["A08:2021-Software and Data Integrity Failures"]
      category: security
      confidence: HIGH
    patterns:
      - pattern: "(ObjectInputStream $OIS).readObject()"

  - id: java-weak-hash-md5
    languages: [java]
    severity: WARNING
    message: "Use of broken cryptographic hash algorithm MessageDigest.getInstance(\"MD5\")"
    metadata:
      cwe: ["CWE-327"]
      owasp: ["A02:2021-Cryptographic Failures"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("MD5")
          - pattern: MessageDigest.getInstance("SHA-1")
