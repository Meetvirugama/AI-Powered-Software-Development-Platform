[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-swe-platform"
version = "1.0.0"
description = "AI-Powered Agentic Software Engineering Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "redis>=5.0,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3,<1.0",
    "httpx>=0.27,<1.0",
    "PyJWT[crypto]>=2.8,<3.0",
    "tiktoken>=0.7,<1.0",
    "pathspec>=0.12.0,<1.0",
    "greenlet>=3.0.0",
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-language-pack>=0.6.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "jsonschema>=4.23,<5.0",
    "opentelemetry-api>=1.25.0,<2.0",
    "opentelemetry-sdk>=1.25.0,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "langfuse>=2.0.0,<6.0.0",
    "ruff>=0.5.0",
    "bandit>=1.7.0",
]

[project.optional-dependencies]
rerank = [
    # Optional: install for cross-encoder re-ranking support (CrossEncoderReranker)
    "sentence-transformers>=3.0,<4.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "pre-commit>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*", "ai*", "scanner*", "indexer*", "sandbox*", "review*", "agent*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
