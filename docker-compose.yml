services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-platform} -d $${POSTGRES_DB:-agent_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SERVICE_ROLE: api
      APP_ENV: production
      DISABLE_EMBEDDED_SYNC_WORKER: "true"
      DATABASE_URL: postgresql://platform:platform@postgres:5432/agent_platform
      ASYNC_DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/agent_platform
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-production-deployment-minimum-32-chars-secret-key-ok}
      JWT_ISSUER: ${JWT_ISSUER:-agent-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-agent-platform-web}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  sync_worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_ROLE: sync_worker
      APP_ENV: production
      DATABASE_URL: postgresql://platform:platform@postgres:5432/agent_platform
      ASYNC_DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/agent_platform
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-production-deployment-minimum-32-chars-secret-key-ok}
      JWT_ISSUER: ${JWT_ISSUER:-agent-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-agent-platform-web}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
