[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = backend/tests
pythonpath = backend .
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: Fast in-memory unit tests
    integration: Database and Redis integration tests
    slow: LLM and AST heavy benchmark suites
